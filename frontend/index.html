<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Architecture Diagram Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            min-height: 600px;
        }

        .input-panel {
            background: #f8fafc;
            padding: 30px;
            border-right: 2px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .diagram-panel {
            padding: 30px;
            background: white;
        }

        .diagram-container {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #cbd5e0;
            position: relative;
        }

        .placeholder {
            text-align: center;
            color: #64748b;
        }

        .placeholder-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4facfe;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(248, 250, 252, 0.95);
            border-radius: 12px;
            z-index: 1000;
            min-height: 400px;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .loading.show {
            visibility: visible !important;
            opacity: 1 !important;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #e2e8f0;
            border-top: 6px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            display: block;
            flex-shrink: 0;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .diagram-actions {
            margin-top: 20px;
            display: none;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .action-btn:hover {
            background: #4f46e5;
        }

        .examples {
            margin-top: 30px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 8px;
        }

        .examples h3 {
            color: #0369a1;
            margin-bottom: 15px;
        }

        .example-item {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .example-item:hover {
            background: #e0f2fe;
        }

        .mermaid {
            background: white !important;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .input-panel {
                border-right: none;
                border-bottom: 2px solid #e2e8f0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Cloud Architecture Diagram Generator</h1>
            <p>AI로 클라우드 아키텍처를 간단하게 시각화하세요</p>
        </div>

        <div class="main-content">
            <div class="input-panel">
                <form id="diagramForm">
                    <div class="form-group">
                        <label for="description">아키텍처 설명</label>
                        <textarea id="description" name="description"
                            placeholder="예: FastAPI 앱을 Cloud Run으로 배포하고, Firestore를 데이터베이스로 사용합니다. 사용자는 Load Balancer를 통해 접근합니다."
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="cloudProvider">클라우드 제공자</label>
                        <select id="cloudProvider" name="cloud_provider">
                            <option value="gcp">Google Cloud Platform</option>
                            <option value="aws">Amazon Web Services</option>
                            <option value="azure">Microsoft Azure</option>
                        </select>
                    </div>

                    <!-- <div class="form-group">
                        <label for="diagramType">다이어그램 타입</label>
                        <select id="diagramType" name="diagram_type">
                            <option value="flowchart">플로우차트</option>
                            <option value="sequence">시퀀스 다이어그램</option>
                        </select>
                    </div> -->

                    <button type="submit" class="generate-btn">
                        <span id="btnText">다이어그램 생성</span>
                    </button>
                </form>

                <div class="examples">
                    <h3>예시 템플릿</h3>
                    <div class="example-item"
                        onclick="setExample('웹 애플리케이션을 GCP Cloud Run으로 배포하고, Cloud SQL을 데이터베이스로 사용합니다. 앞에 Load Balancer가 있고 정적 파일은 Cloud Storage에 저장됩니다.')">
                        📱 웹 앱 + 데이터베이스
                    </div>
                    <div class="example-item"
                        onclick="setExample('마이크로서비스 아키텍처로 API Gateway를 통해 여러 서비스에 라우팅하고, 각 서비스는 독립적인 데이터베이스를 가집니다.')">
                        🔧 마이크로서비스 아키텍처
                    </div>
                    <div class="example-item"
                        onclick="setExample('데이터 파이프라인을 구축합니다. Cloud Storage에서 데이터를 읽어 BigQuery로 처리하고 결과를 시각화합니다.')">
                        📊 데이터 파이프라인
                    </div>
                </div>
            </div>

            <div class="diagram-panel">
                <div class="diagram-container" id="diagramContainer">
                    <div class="placeholder" id="placeholder">
                        <div class="placeholder-icon">📊</div>
                        <h3>다이어그램이 여기에 표시됩니다</h3>
                        <p>왼쪽 패널에서 아키텍처를 설명하고 '다이어그램 생성' 버튼을 클릭하세요.</p>
                    </div>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p style="font-size: 18px; font-weight: 600; margin-bottom: 5px;">AI가 다이어그램을 생성하고 있습니다</p>
                        <p style="font-size: 14px; opacity: 0.8;">잠시만 기다려주세요...</p>
                    </div>
                </div>
                <div class="diagram-actions" id="diagramActions">
                    <button class="action-btn" onclick="downloadDiagram('svg')">SVG 다운로드</button>
                    <button class="action-btn" onclick="downloadDiagram('png')">PNG 다운로드</button>
                    <button class="action-btn" onclick="copyMermaidCode()">코드 복사</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mermaid 초기화 - 아이콘 지원 설정
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true
            },
            architecture: {
                useMaxWidth: true,
                htmlLabels: true
            },
            // 아이콘 지원을 위한 설정
            dompurifyConfig: {
                USE_PROFILES: { svg: true, svgFilters: true },
                ADD_TAGS: ['iconify-icon'],
                ADD_ATTR: ['icon', 'width', 'height', 'inline']
            }
        });

        
        // 아이콘 파일 URL 동적 생성 함수
        function getIconUrl(filename) {
            // 현재 페이지의 base URL을 기준으로 절대 경로 생성
            const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');
            
            // Cloud Storage 호스팅인 경우 올바른 도메인 사용
            if (window.location.hostname.includes('storage.googleapis.com')) {
                // 버킷 이름 추출
                const pathParts = window.location.pathname.split('/');
                const bucketName = pathParts[1] || window.location.hostname.split('.')[0];
                return `https://storage.googleapis.com/${bucketName}/icons/${filename}`;
            }
            
            // 로컬 또는 기타 호스팅의 경우 상대 경로 사용
            return `${baseUrl}/icons/${filename}`;
        }

        mermaid.registerIconPacks([
            {
                name: 'gcp',
                loader: () =>
                    fetch(getIconUrl('gcp.json')).then((res) => res.json()),
            },
            {
              name: 'azr',
              loader: () =>
                    fetch(getIconUrl('azr.json')).then((res) => res.json()),
              //   fetch('https://unpkg.com/azureiconkento@1.1.1/azureicons/allicons.json').then((res) => res.json()),
            },
            {
                name: 'aws',
                loader: () =>
                    fetch(getIconUrl('aws.json')).then((res) => res.json()),
            },
        ]);

        let currentMermaidCode = '';
        let mermaidCounter = 0;

        // 환경에 따른 API URL 자동 설정
        function getApiBaseUrl() {
            // 환경 변수나 메타 태그에서 API URL 확인 (최우선)
            const metaApiUrl = document.querySelector('meta[name="api-base-url"]');
            if (metaApiUrl && metaApiUrl.content) {
                return metaApiUrl.content;
            }

            // 현재 도메인이 localhost인 경우 로컬 개발 환경
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:8080';
            }

            // 프로덕션 환경에서는 현재 도메인 기반으로 API URL 구성
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;

            // Cloud Storage 호스팅의 경우 (.storage.googleapis.com 또는 storage.googleapis.com)
            if (hostname.includes('storage.googleapis.com')) {
                // Cloud Storage에서 호스팅되는 경우, 메타 태그가 없으면 기본 백엔드 URL 패턴 사용
                // 일반적으로 배포 스크립트에서 메타 태그를 설정하므로 이 경우는 드물어야 함
                console.warn('Cloud Storage 호스팅에서 API URL이 메타 태그로 설정되지 않았습니다.');
                return 'https://cloud-diagram-generator-hfqglxuxxa-du.a.run.app'
            }
        }

        const API_BASE_URL = getApiBaseUrl();

        // 디버깅을 위한 API URL 확인
        console.log('🔗 API Base URL:', API_BASE_URL);
        console.log('🌍 Current hostname:', window.location.hostname);

        // 폼 제출 이벤트
        document.getElementById('diagramForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await generateDiagram();
        });

        // 다이어그램 생성
        async function generateDiagram() {
            const formData = new FormData(document.getElementById('diagramForm'));
            const requestData = {
                description: formData.get('description'),
                cloud_provider: formData.get('cloud_provider'),
                diagram_type: 'architecture-beta', // formData.get('diagram_type')
            };

            showLoading();

            try {
                console.log('📤 API 요청:', `${API_BASE_URL}/generate-diagram`);
                console.log('📋 요청 데이터:', requestData);

                const response = await fetch(`${API_BASE_URL}/generate-diagram`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('📥 API 응답:', data);

                if (!data.mermaid_code) {
                    throw new Error('API 응답에 mermaid_code가 없습니다.');
                }

                currentMermaidCode = data.mermaid_code;
                console.log('🎯 Mermaid 코드:', currentMermaidCode);

                await renderMermaidDiagram(currentMermaidCode);
                showDiagramActions();

            } catch (error) {
                console.error('❌ API 에러:', error);

                // 네트워크 오류인지 확인
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    showError(`API 서버에 연결할 수 없습니다.<br><br>
                        <strong>현재 API URL:</strong> ${API_BASE_URL}<br><br>
                        <em>배포가 완료되었는지 확인하거나 잠시 후 다시 시도해주세요.</em>`);
                } else {
                    showError('다이어그램 생성에 실패했습니다.<br><br>' +
                        '<strong>오류:</strong> ' + error.message);
                }
            }
        }

        // Mermaid 다이어그램 렌더링 - 안정적인 방식
        async function renderMermaidDiagram(code) {
            const container = document.getElementById('diagramContainer');

            if (!container) {
                console.error('❌ 다이어그램 컨테이너를 찾을 수 없습니다');
                hideLoading();
                return;
            }

            try {
                console.log('🎨 Mermaid 코드 렌더링 시작:', code);

                // 기존 다이어그램만 제거 (placeholder, loading 요소는 보존)
                const existingDiagrams = container.querySelectorAll('div:not(#placeholder):not(#loading)');
                existingDiagrams.forEach(diagram => {
                    diagram.remove();
                });

                // 고유 ID 생성
                mermaidCounter++;
                const graphDefinition = `mermaid-${mermaidCounter}`;

                console.log('🔧 Mermaid render 시도...');

                // mermaid.render 방식 사용 (가장 안정적)
                const renderResult = await mermaid.render(graphDefinition, code);

                // SVG 삽입
                const svgContainer = document.createElement('div');
                svgContainer.style.textAlign = 'center';
                svgContainer.style.padding = '20px';
                svgContainer.innerHTML = renderResult.svg;

                container.appendChild(svgContainer);

                console.log('✅ Mermaid 렌더링 완료');
                hideLoading();

            } catch (error) {
                console.error('❌ mermaid.render 실패:', error);

                // 대체 방법: 전통적인 방식
                try {
                    console.log('� 대체 방법 시도...');

                    mermaidCounter++;
                    const fallbackId = `mermaid-fallback-${mermaidCounter}`;

                    // 새로운 Mermaid 요소 생성 및 삽입
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.id = fallbackId;
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.style.textAlign = 'center';
                    mermaidDiv.style.padding = '20px';
                    mermaidDiv.textContent = code;

                    container.appendChild(mermaidDiv);

                    // DOM 렌더링 대기
                    await new Promise(resolve => setTimeout(resolve, 200));

                    // 요소 확인
                    const mermaidElement = document.getElementById(fallbackId);
                    if (!mermaidElement) {
                        throw new Error('Mermaid 요소를 찾을 수 없습니다.');
                    }

                    // 기존 처리 상태 제거
                    mermaidElement.removeAttribute('data-processed');

                    // mermaid.init 호출
                    mermaid.init(undefined, mermaidElement);

                    console.log('✅ 대체 방법으로 렌더링 완료');
                    hideLoading();

                } catch (fallbackError) {
                    console.error('❌ 모든 렌더링 방법 실패:', fallbackError);

                    // 최종 대체: 텍스트 형태로라도 표시
                    showError(`다이어그램 렌더링에 실패했습니다.<br><br>
                        <strong>오류 1:</strong> ${error.message}<br>
                        <strong>오류 2:</strong> ${fallbackError.message}<br><br>
                        <strong>Mermaid 코드:</strong><br>
                        <pre style="text-align: left; background: #f5f5f5; padding: 15px; border-radius: 4px; font-size: 12px; overflow-x: auto; margin: 10px 0;">${code}</pre>
                        <br><small>💡 이 코드를 <a href="https://mermaid.live" target="_blank">mermaid.live</a>에서 직접 테스트해보세요.</small>`);
                }
            }
        }

        // 로딩 표시
        function showLoading() {
            const container = document.getElementById('diagramContainer');
            const placeholderElement = document.getElementById('placeholder');
            const loadingElement = document.getElementById('loading');
            const btnTextElement = document.getElementById('btnText');
            const buttonElement = document.querySelector('.generate-btn');
            const actionsElement = document.getElementById('diagramActions');

            console.log('🔄 로딩 표시 시작');

            // 기존 다이어그램 내용 모두 숨기기
            if (container) {
                // 기존 렌더된 다이어그램이 있다면 숨기기
                const existingDiagrams = container.querySelectorAll('div:not(#placeholder):not(#loading)');
                existingDiagrams.forEach(diagram => {
                    diagram.style.display = 'none';
                });
            }

            // placeholder와 actions 숨기기
            if (placeholderElement) {
                placeholderElement.style.display = 'none';
                console.log('✅ placeholder 숨김');
            }
            if (actionsElement) {
                actionsElement.style.display = 'none';
                console.log('✅ actions 숨김');
            }
            
            // 로딩 표시 - 클래스와 인라인 스타일 모두 사용
            if (loadingElement) {
                // 클래스 추가
                loadingElement.classList.add('show');
                
                // 인라인 스타일도 강제로 설정 (CSS 우선순위 무시)
                loadingElement.style.display = 'flex';
                loadingElement.style.visibility = 'visible';
                loadingElement.style.opacity = '1';
                loadingElement.style.zIndex = '1000';
                
                console.log('✅ 로딩 스피너 표시 (클래스 + 인라인 스타일)');
                
                // 디버깅: 로딩 요소의 실제 크기와 위치 확인
                setTimeout(() => {
                    const rect = loadingElement.getBoundingClientRect();
                    const computedStyle = window.getComputedStyle(loadingElement);
                    console.log('📏 로딩 요소 크기:', rect.width, 'x', rect.height);
                    console.log('📍 로딩 요소 위치:', rect.left, rect.top);
                    console.log('🎨 계산된 스타일 - display:', computedStyle.display);
                    console.log('🎨 계산된 스타일 - visibility:', computedStyle.visibility);
                    console.log('🎨 계산된 스타일 - opacity:', computedStyle.opacity);
                }, 100);
            } else {
                console.error('❌ 로딩 요소를 찾을 수 없음');
            }
            
            // 버튼 상태 변경
            if (btnTextElement) {
                btnTextElement.textContent = '생성 중...';
                console.log('✅ 버튼 텍스트 변경');
            }
            if (buttonElement) {
                buttonElement.disabled = true;
                console.log('✅ 버튼 비활성화');
            }
        }

        // 로딩 숨기기
        function hideLoading() {
            const loadingElement = document.getElementById('loading');
            const btnTextElement = document.getElementById('btnText');
            const buttonElement = document.querySelector('.generate-btn');

            console.log('🔄 로딩 숨김 시작');

            if (loadingElement) {
                // 클래스 제거
                loadingElement.classList.remove('show');
                
                // 인라인 스타일로도 확실히 숨기기
                loadingElement.style.visibility = 'hidden';
                loadingElement.style.opacity = '0';
                
                console.log('✅ 로딩 스피너 숨김 (클래스 + 인라인 스타일)');
            }
            if (btnTextElement) {
                btnTextElement.textContent = '다이어그램 생성';
                console.log('✅ 버튼 텍스트 복원');
            }
            if (buttonElement) {
                buttonElement.disabled = false;
                console.log('✅ 버튼 활성화');
            }
        }

        // 다이어그램 액션 버튼 표시
        function showDiagramActions() {
            const actionsElement = document.getElementById('diagramActions');
            if (actionsElement) {
                actionsElement.style.display = 'flex';
            }
        }

        // 에러 표시
        function showError(message) {
            const container = document.getElementById('diagramContainer');
            const placeholderElement = document.getElementById('placeholder');
            const loadingElement = document.getElementById('loading');

            // 로딩 먼저 숨기기
            hideLoading();

            // 기존 다이어그램 제거
            if (container) {
                const existingDiagrams = container.querySelectorAll('div:not(#placeholder):not(#loading)');
                existingDiagrams.forEach(diagram => {
                    diagram.remove();
                });

                // placeholder 내용을 에러 메시지로 교체
                if (placeholderElement) {
                    placeholderElement.innerHTML = `
                        <div class="placeholder-icon">⚠️</div>
                        <h3>오류가 발생했습니다</h3>
                        <div style="text-align: left; max-width: 400px; margin: 0 auto;">${message}</div>
                    `;
                    placeholderElement.style.display = 'block';
                }
            }
        }

        // 예시 템플릿 설정
        function setExample(text) {
            document.getElementById('description').value = text;
        }

        // 다이어그램 다운로드
        function downloadDiagram(format) {
            const svg = document.querySelector('#diagramContainer svg');
            if (!svg) return;

            if (format === 'svg') {
                const svgData = new XMLSerializer().serializeToString(svg);
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
                const svgUrl = URL.createObjectURL(svgBlob);
                const link = document.createElement('a');
                link.href = svgUrl;
                link.download = 'cloud-architecture.svg';
                link.click();
                URL.revokeObjectURL(svgUrl);
            } else if (format === 'png') {
                // SVG를 Canvas로 변환 후 PNG 다운로드
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();

                const svgData = new XMLSerializer().serializeToString(svg);
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
                const svgUrl = URL.createObjectURL(svgBlob);

                img.onload = function () {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob(function (blob) {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'cloud-architecture.png';
                        link.click();
                        URL.revokeObjectURL(link.href);
                    });

                    URL.revokeObjectURL(svgUrl);
                };

                img.src = svgUrl;
            }
        }

        // Mermaid 코드 복사
        function copyMermaidCode() {
            if (currentMermaidCode) {
                navigator.clipboard.writeText(currentMermaidCode).then(() => {
                    alert('Mermaid 코드가 클립보드에 복사되었습니다!');
                });
            }
        }

        // AWS 로고 테스트 함수
        function testAwsLogos() {
            // Architecture-beta 다이어그램 형태로 테스트
            const awsCode = `architecture-beta
    group vpc(logos:aws-vpc)[VPC]
    service app(logos:aws-ec2)[Application Server] in vpc
    service storage(logos:aws-s3)[S3 Bucket] in vpc
    service db(logos:aws-aurora)[Database] in vpc
    service internet(logos:aws-cloudfront)[Internet Gateway] in vpc

    internet:B -- T:app
    app:L -- R:storage
    app:R -- L:db`;

            console.log('🧪 AWS 로고 테스트...');
            currentMermaidCode = awsCode;
            showLoading();
            renderMermaidDiagram(awsCode).then(() => {
                showDiagramActions();
                console.log('✅ AWS 로고 테스트 완료');
            }).catch(error => {
                console.error('❌ AWS 로고 테스트 실패:', error);

                // 대체 방법: Simple Icons 형태로 시도
                console.log('🔄 Simple Icons 형태로 재시도...');
                const simpleIconsCode = `graph TB
    subgraph "AWS VPC"
        A["fa:fa-cloud Application Server<br/>(EC2)"]
        B["fa:fa-database S3 Bucket"]
        C["fa:fa-server Database<br/>(Aurora)"]
        D["fa:fa-globe Internet Gateway<br/>(CloudFront)"]
    end
    
    D --> A
    A --> B
    A --> C`;

                currentMermaidCode = simpleIconsCode;
                renderMermaidDiagram(simpleIconsCode).then(() => {
                    showDiagramActions();
                    console.log('✅ Font Awesome 아이콘으로 대체 완료');
                }).catch(fallbackError => {
                    console.error('❌ 모든 아이콘 테스트 실패:', fallbackError);
                });
            });
        }

        // 디버깅용 테스트 함수
        function testMermaidCode() {
            const testCode = `graph TB
    A[User] --> B[Load Balancer]
    B --> C[Cloud Run]
    C --> D[Cloud SQL]
    C --> E[Cloud Storage]`;

            console.log('🧪 테스트 Mermaid 코드 렌더링...');

            renderMermaidDiagram(testCode).then(() => {

        // 간단한 다이어그램 테스트 함수
        function testSimpleDiagram() {
            const simpleCode = `graph LR
    A --> B
    B --> C`;

            currentMermaidCode = simpleCode;

        // 로딩 스피너 테스트 함수
        function testLoadingSpinner() {
            console.log('🧪 로딩 스피너 직접 테스트...');
            const loadingElement = document.getElementById('loading');
            
            if (!loadingElement) {
                console.error('❌ 로딩 요소 없음');
                return;
            }
            
            console.log('📋 초기 상태:', {
                display: window.getComputedStyle(loadingElement).display,
                visibility: window.getComputedStyle(loadingElement).visibility,
                opacity: window.getComputedStyle(loadingElement).opacity,
                classes: loadingElement.className
            });
            
            // 강제로 스피너 표시
            loadingElement.style.display = 'flex';
            loadingElement.style.visibility = 'visible';
            loadingElement.style.opacity = '1';
            loadingElement.style.zIndex = '1000';
            loadingElement.classList.add('show');
            
            console.log('🔧 강제 표시 후 상태:', {
                display: window.getComputedStyle(loadingElement).display,
                visibility: window.getComputedStyle(loadingElement).visibility,
                opacity: window.getComputedStyle(loadingElement).opacity,
                classes: loadingElement.className,
                rect: loadingElement.getBoundingClientRect()
            });
            
            // 3초 후 숨기기
            setTimeout(() => {
                loadingElement.style.visibility = 'hidden';
                loadingElement.style.opacity = '0';
                loadingElement.classList.remove('show');
                console.log('✅ 테스트 완료 - 스피너 숨김');
            }, 3000);
        }

        // 즉시 테스트 함수 (페이지 로드 후)
        function immediateTest() {
            console.log('🚀 즉시 테스트 시작...');
            setTimeout(() => {
                testSimpleDiagram();
            }, 1000);
        }

        // 페이지 로드 시 디버깅 도구 추가
        window.addEventListener('load', () => {
            console.log('🎯 페이지 로드 완료');
            console.log('🔧 사용 가능한 디버깅 함수들:');
            console.log('  - window.testMermaidCode() : 복잡한 다이어그램 테스트');
            console.log('  - window.testSimpleDiagram() : 간단한 다이어그램 테스트');
            console.log('  - window.testAwsLogos() : AWS 로고 테스트');
            console.log('  - window.testLoadingSpinner() : 로딩 스피너 직접 테스트');
            console.log('  - window.immediateTest() : 즉시 테스트 실행');
            console.log('  - Mermaid 버전:', mermaid.version || 'unknown');

            // 개발자 도구에서 테스트할 수 있도록 전역 함수로 노출
            window.testMermaidCode = testMermaidCode;
            window.testSimpleDiagram = testSimpleDiagram;
            window.testAwsLogos = testAwsLogos;
            window.testLoadingSpinner = testLoadingSpinner;
            window.immediateTest = immediateTest;
        });
    </script>
